name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Interaction tests
        run: |
          npx vite dev --port 5173 &
          npx wait-on -t 60000 http://localhost:5173/gallery
          npm run test:interact -- http://localhost:5173

  # The dev toolchain (SvelteKit 3, vite-plugin-svelte 7) needs a far newer Svelte than the peer floor, so
  # `npm run check` and `npm test` cannot run against the minimum. Instead compile every component with the
  # minimum Svelte compiler in an isolated install. Keep the version in sync with the svelte peer range.
  min-svelte:
    name: compile (minimum svelte)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Compile components with svelte 5.16.0
        run: |
          mkdir "$RUNNER_TEMP/min-svelte"
          cp scripts/compile-components.mjs "$RUNNER_TEMP/min-svelte/"
          npm install --prefix "$RUNNER_TEMP/min-svelte" --no-audit --no-fund svelte@5.16.0
          node "$RUNNER_TEMP/min-svelte/compile-components.mjs" src/lib
