name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Interaction tests
        run: |
          npx vite dev --port 5173 &
          npx wait-on -t 60000 http://localhost:5173/gallery
          npm run test:interact -- http://localhost:5173
