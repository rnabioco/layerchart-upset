name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Interaction tests
        run: |
          npx vite dev --port 5173 &
          npx wait-on -t 60000 http://localhost:5173/gallery
          npm run test:interact -- http://localhost:5173

  min-svelte:
    name: check (minimum svelte)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The dev toolchain (SvelteKit, vite-plugin-svelte) needs a newer svelte than the peer floor, so
      # generate .svelte-kit with the locked svelte first, then swap in the minimum for check and test.
      # Keep the version below in sync with the svelte peer range in package.json
      - run: npx svelte-kit sync
      - name: Swap in svelte 5.16.0
        run: |
          npm pack svelte@5.16.0 --silent
          rm -rf node_modules/svelte && mkdir node_modules/svelte
          tar -xzf svelte-5.16.0.tgz -C node_modules/svelte --strip-components=1
          rm svelte-5.16.0.tgz
          node -p "'svelte ' + require('svelte/package.json').version"
      - run: npx svelte-check --tsconfig ./tsconfig.json
      - run: npm test
