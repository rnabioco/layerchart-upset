name: Publish

# Stage the package on npm when a GitHub release is published. Nothing goes live until
# someone approves it with 2FA: `npm stage list layerchart-upset`, then `npm stage approve <id>`.
# Auth is npm trusted publishing (OIDC): no token is stored. The trusted publisher on npmjs.com is
# rnabioco/layerchart-upset, workflow `publish.yml`, no environment.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # npm >= 11.5.1 for trusted publishing
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$v" != "$GITHUB_REF_NAME" ]; then
            echo "release tag $GITHUB_REF_NAME does not match package.json ($v)" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm stage publish --provenance --access public
